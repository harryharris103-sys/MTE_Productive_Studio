<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MTE Productive Studio</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1A1A1A">
<style>
:root{--g:#C9932E;--d:#1A1A1A;--p:#242424;--l:#3a3a3a;--m:#9a9a9a;--t:#f2f2f2;font-family:Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--d);color:var(--t);font-size:13px}
body{height:100dvh;display:grid;grid-template-rows:auto 1fr;grid-template-columns:76px 1fr 280px;grid-template-areas:"top top top" "tools stage side";overflow:hidden}
header{grid-area:top;border-bottom:2px solid var(--g);padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top))}
#hmain,#hmore{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#hmore{margin-top:6px}
.lg{width:28px;height:28px;border-radius:6px}.brand{font-size:14px;letter-spacing:.05em}.brand i{color:var(--g);font-style:normal}
.ver{font-size:10px;color:var(--d);background:var(--g);border-radius:9px;padding:1px 6px;font-weight:700}
.sp{flex:1}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:4px;padding:6px 9px}
button{cursor:pointer}button:hover{border-color:var(--g)}button.pri{background:var(--g);color:var(--d);border-color:var(--g);font-weight:700}
button.on{border-color:var(--g);background:#3a2f17}
input[type=color]{padding:0;width:34px;height:28px}input[type=number]{width:68px}input[type=range]{padding:0}
label{display:inline-flex;gap:4px;align-items:center}.chk input{width:auto}
:focus-visible{outline:2px solid var(--g);outline-offset:1px}
#wsTabs{display:flex;gap:4px;margin-left:8px}
#tools{grid-area:tools;display:flex;flex-direction:column;gap:5px;padding:8px;border-right:1px solid var(--l);overflow:auto}
#tools button{width:100%;padding:8px 2px;font-size:12px}
#stage{grid-area:stage;overflow:auto;display:grid;place-items:center;background:#101010;padding:20px;position:relative;touch-action:pan-x pan-y}
#stage.drag{outline:3px dashed var(--g);outline-offset:-10px}
.cw{box-shadow:0 0 0 1px var(--l),0 10px 40px #000;background:repeating-conic-gradient(#2c2c2c 0 25%,#222 0 50%) 0 0/16px 16px}
#side{grid-area:side;border-left:1px solid var(--l);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:12px}
h3{margin:0 0 6px;font-size:12px;color:var(--g)}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sw{width:22px;height:22px;padding:0;border-radius:50%}
.ib{padding:5px 7px;line-height:0}.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.ly{display:flex;gap:4px;align-items:center;padding:3px;border:1px solid transparent;border-radius:4px}
.ly.on{border-color:var(--g);background:var(--p)}.ly span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.ly button{padding:1px 6px}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--g);color:var(--d);padding:8px 14px;border-radius:6px;font-weight:700;display:none;z-index:99;max-width:92vw}
#fab,#soBar{display:none}
#soBar{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--g);color:var(--d);padding:6px 10px;gap:8px;align-items:center;font-weight:700}
.wsp{grid-column:1/-1;grid-row:2/-1;display:none;flex-direction:column;overflow:auto;padding:10px;gap:8px}
body:not([data-ws=design]) :is(#tools,#stage,#side,#hmore,#fab){display:none!important}
body[data-ws=office] #ws-office{display:flex}
dialog{background:var(--d);color:var(--t);border:2px solid var(--g);border-radius:10px;padding:14px;max-width:min(720px,96vw);width:96vw;max-height:92dvh;overflow:auto}
dialog::backdrop{background:#000a}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.grid button{text-align:left;padding:8px}.grid small{display:block;color:var(--m)}
table.sh{border-collapse:collapse}.sh td,.sh th{border:1px solid var(--l);padding:0}.sh th{background:var(--p);padding:2px 6px;color:var(--m);font-weight:400}
.sh input{border:0;border-radius:0;width:96px;background:transparent}
textarea.pp{width:100%;min-height:34px;resize:vertical}
small.m{color:var(--m)}
@media(max-width:800px){
 body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "stage" "tools"}
 header{padding:4px 6px;padding-top:max(4px,env(safe-area-inset-top))}
 .brand{display:none}#hmain button{padding:6px 8px}
 #hmore{display:none}#hmore.show{display:flex}
 #tools{flex-direction:row;border-right:0;border-top:1px solid var(--l);overflow-x:auto;overflow-y:hidden;padding:5px 6px calc(5px + env(safe-area-inset-bottom));flex-wrap:nowrap;gap:4px}
 #tools button{width:auto;flex:0 0 auto;min-width:54px;min-height:40px;padding:6px 8px}
 #stage{padding:6px}
 #side{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));max-height:55dvh;z-index:20;background:var(--d);border:1px solid var(--g);border-radius:12px 12px 0 0;transform:translateY(120%);transition:transform .2s}
 #side.open{transform:none}
 #fab{display:block;position:fixed;right:10px;bottom:calc(62px + env(safe-area-inset-bottom));z-index:21;border-radius:20px;background:var(--g);color:var(--d);font-weight:700;border-color:var(--g)}
 button,select,input{min-height:34px}
}
</style></head><body data-ws="design">
<header>
 <div id="hmain">
  <img src="icon.svg" alt="" class="lg"><b class="brand">MTE <i>Productive</i> Studio</b><span class="ver" id="ver"></span>
  <nav id="wsTabs" aria-label="Workspaces"><button data-ws="design" class="on">Design</button></nav>
  <span class="sp"></span>
  <button id="bNew" class="pri">+ New</button><button id="open">Open</button><button class="pri" id="bSave" title="Save project (Ctrl+S)">Save</button><button id="bSaveAs" title="Save as (Ctrl+Shift+S)">Save as</button><span id="dirty" title="Unsaved changes" style="color:var(--g)"></span>
  <button id="undo" title="Ctrl+Z" aria-label="Undo">&#8630;</button><button id="redo" title="Ctrl+Y" aria-label="Redo">&#8631;</button>
  <button class="pri" id="export">Export</button><button id="bMore" aria-label="More options">&#9776;</button>
  <input id="file" type="file" multiple hidden accept=".svg,.psd,.pdf,.ai,.png,.jpg,.jpeg,.webp,.gif,.mte,.json,.docx,.pptx,.xlsx,.xls,.ods,.csv,.odt,.odp">
 </div>
 <div id="hmore">
  <input id="pname" placeholder="Project name" style="width:140px" aria-label="Project name">
  <button id="bSize" title="Canvas size"><span id="info"></span></button>
  <label>Colour <select id="cmode"><option value="rgb">RGB</option><option value="cmyk">CMYK</option></select></label>
  <label>Scale <select id="sc"><option>1</option><option>2</option><option>3</option><option value="3.125">300 dpi</option><option>4</option></select></label>
  <select id="fmt" aria-label="Export format"><option value="png-t">PNG (transparent)</option><option value="png">PNG</option><option value="jpg">JPG</option><option value="jpeg">JPEG</option><option value="webp">WEBP</option><option value="svg">SVG (editable)</option><option value="pdf-l">PDF (layered)</option><option value="pdf">PDF (flat)</option><option value="psd">PSD (layers, live text)</option><option value="ai">AI (PDF-compatible, layered)</option><option value="mte">MTE project</option></select>
  <label class="chk"><input type="checkbox" id="xlive" checked>Live text</label><label class="chk"><input type="checkbox" id="xproj" checked>Embed project</label>
 </div>
</header>
<div id="soBar"><span>Editing smart object</span><button id="soDone" class="pri" style="background:var(--d);color:var(--g)">Update &amp; return</button><button id="soCancel">Cancel</button></div>
<nav id="tools" aria-label="Tools">
 <button data-t="text">Text</button><button data-t="rect">Rect</button><button data-t="ell">Ellipse</button><button data-t="tri">Triangle</button><button data-t="line">Line</button><button data-t="img">Image</button>
 <button data-t="logo">MTE logo</button><button data-t="word">Wordmark</button>
 <button data-t="group">Group</button><button data-t="ungroup">Ungroup</button><button data-t="dup">Duplicate</button><button data-t="del">Delete</button>
 <button data-t="post">Social post</button><button data-t="zin">Zoom +</button><button data-t="zout">Zoom &minus;</button><button data-t="fit">Fit</button>
</nav>
<main id="stage"><div class="cw"><canvas id="c"></canvas></div></main>
<button id="fab">Panel</button>
<aside id="side">
 <section><h3>Fill &amp; stroke</h3>
  <div class="row"><select id="ftarget" aria-label="Target"><option value="sel">Target: selection</option><option value="bg">Target: canvas background</option></select><select id="ftype"><option value="solid">Solid</option><option value="linear">Linear gradient</option><option value="radial">Radial gradient</option></select></div>
  <div class="row"><label>A <input id="fill" type="color" value="#C9932E"></label><label id="lblB">B <input id="fill2" type="color" value="#1A1A1A"></label><label id="lblAng">Angle <input id="fang" type="number" value="90" min="0" max="360"></label></div>
  <div class="row" id="cmykrow" hidden><label>C<input id="cc" type="number" min="0" max="100" value="0"></label><label>M<input id="cm" type="number" min="0" max="100" value="0"></label><label>Y<input id="cy" type="number" min="0" max="100" value="0"></label><label>K<input id="ck" type="number" min="0" max="100" value="0"></label></div>
  <div class="row"><label>Stroke <input id="stroke" type="color" value="#1A1A1A"></label><label>Width <input id="sw" type="number" min="0" value="0"></label></div>
  <div class="row"><label>Opacity <input id="op" type="range" min="0" max="1" step=".05" value="1"></label></div>
  <div class="row" id="pal"></div>
 </section>
 <section><h3>Text</h3>
  <div class="row"><select id="ff"><option>Arial</option><option>Helvetica</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option><option>Trebuchet MS</option><option>Tahoma</option><option>Courier New</option><option>Impact</option></select><input id="fs" type="number" min="6" value="48"></div>
  <div class="row"><button id="bold"><b>B</b></button><button id="ital"><i>I</i></button><button id="und"><u>U</u></button><span id="taRow"></span></div>
  <div class="row"><label>Spacing <input id="tsp" type="number" value="0" step="10"></label><label>Line <input id="tlh" type="number" value="1.16" step=".05"></label></div>
 </section>
 <section><h3>Align</h3>
  <div class="row"><select id="alto"><option value="auto">Auto (selection if 2+)</option><option value="canvas">To canvas</option><option value="sel">To selection</option></select></div>
  <div class="row" id="alRow"></div>
 </section>
 <section><h3>Effects</h3>
  <div class="row"><select id="blend" aria-label="Blend mode"></select></div>
  <div class="row"><button id="bwhite" title="Multiply: white disappears">Blend on white</button><button id="bblack" title="Screen: black disappears">Blend on black</button></div>
  <div class="row"><select id="bif"><option value="off">Blend-If: off</option><option value="white">Knock out white</option><option value="black">Knock out black</option></select><label>Level <input id="bifT" type="range" min="0" max="255" value="235"></label><label>Soft <input id="bifS" type="range" min="1" max="100" value="30"></label></div>
  <div class="row"><button id="clipMake">Clip to layer below</button><button id="clipRel">Release clip</button></div>
  <div class="row"><button id="pEdit">Edit points</button><button id="toPath">To path</button><button id="svgCode">SVG code</button><button id="smartEdit" hidden>Edit smart object</button></div>
 </section>
 <section><h3>Layers</h3><div id="layers"></div></section>
 <section><small class="m">Opens SVG, PSD, PDF, AI, images, .mte and Office files (DOCX, PPTX, XLSX). Drop files onto the canvas. Arrow keys nudge (Shift = 10px).</small></section>
</aside>
<section class="wsp" id="ws-office" aria-label="Office"></section>
<div id="toast" role="status"></div>

<dialog id="dNew"><h3 id="dNewT">New project</h3>
 <div class="chips" id="dCats"></div><div class="grid" id="dPre"></div>
 <h3 style="margin-top:12px">Custom size</h3>
 <div class="row"><label>Width <input id="nw" type="number" step="any" min="1" value="1080"></label><label>Height <input id="nh" type="number" step="any" min="1" value="1080"></label>
 <select id="nu" aria-label="Units"><option>px</option><option>in</option><option>mm</option><option>cm</option></select>
 <label>DPI <select id="nd"><option>72</option><option selected>96</option><option>150</option><option>300</option></select></label></div>
 <div class="row"><label>Colour <select id="ncm"><option value="rgb">RGB</option><option value="cmyk">CMYK</option></select></label><label>Background <input id="nbg" type="color" value="#ffffff"></label><label class="chk" id="nTabL"><input type="checkbox" id="nTab" checked>Open in new tab</label></div>
 <small class="m" id="nPx"></small>
 <div class="row" style="margin-top:10px"><button class="pri" id="nGo">Create</button><button id="nCancel">Cancel</button></div>
</dialog>
<dialog id="dSvg"><h3>SVG code</h3><textarea id="svgTa" class="pp" style="min-height:44dvh;font-family:monospace;font-size:12px" spellcheck="false"></textarea>
 <div class="row" style="margin-top:8px"><button class="pri" id="svgApply">Apply</button><button id="svgDl">Download .svg</button><button id="svgClose">Close</button></div></dialog>
<dialog id="dPdf"><h3>Import PDF / AI</h3>
 <div class="row"><label>Mode <select id="pdfMode"><option value="layers">Layers (one editable layer per PDF layer)</option><option value="vector">Vector (editable paths, best effort)</option><option value="flat">Flat page</option></select></label><label>Page <input id="pdfPg" type="number" min="1" value="1"></label></div>
 <small class="m" id="pdfInfo"></small>
 <div class="row" style="margin-top:10px"><button class="pri" id="pdfGo">Import</button><button id="pdfCancel">Cancel</button></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script>
/* ===== MTE Productive Studio — keep VERSION in sync with sw.js (V) ===== */
const VERSION='0.0.2';let dirty=false,fh=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],GOLD='#C9932E',INK='#1A1A1A';
const PROPS=['name','smartId','maskName','cmyk'];
const LIBS={pdf:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib'],psd:['https://cdn.jsdelivr.net/npm/ag-psd@28.2.0/dist/bundle.js','agPsd'],zip:['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','JSZip'],xlsx:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','XLSX']};
const lib=k=>window[LIBS[k][1]]?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=LIBS[k][0];s.onload=ok;s.onerror=()=>no(new Error(k+' library failed to load. Connect once to cache it.'));document.head.append(s)});
let tm;const toast=(m,keep)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tm);if(!keep)tm=setTimeout(()=>t.style.display='none',4200)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* units and colour helpers */
const toPx=(v,u,d)=>u==='in'?v*d:u==='cm'?v/2.54*d:u==='mm'?v/25.4*d:v;
const fromPx=(p,u,d)=>u==='in'?p/d:u==='cm'?p/d*2.54:u==='mm'?p/d*25.4:p;
const r2=n=>Math.round(n*100)/100;
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const hex2rgb=h=>{h=(h||'#000').replace('#','');if(h.length===3)h=[...h].map(x=>x+x).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]};
const rgb2cmyk=(r,g,b)=>{r/=255;g/=255;b/=255;const k=1-Math.max(r,g,b);if(k>=1)return[0,0,0,100];return[(1-r-k)/(1-k),(1-g-k)/(1-k),(1-b-k)/(1-k),k].map(v=>Math.round(v*100))};
const cmyk2rgb=(c,m,y,k)=>[255*(1-c/100)*(1-k/100),255*(1-m/100)*(1-k/100),255*(1-y/100)*(1-k/100)];
const hexAny=s=>{try{return '#'+new fabric.Color(s).toHex()}catch(e){return '#000000'}};

/* ===== custom Blend-If filter (knock out white / black like Photoshop's Blend If) ===== */
try{fabric.filterBackend=new fabric.Canvas2dFilterBackend()}catch(e){}
fabric.Image.filters.BlendIf=fabric.util.createClass(fabric.Image.filters.BaseFilter,{
 type:'BlendIf',mode:'white',threshold:235,soft:30,
 applyTo2d(o){const d=o.imageData.data,t=+this.threshold,s=Math.max(1,+this.soft),w=this.mode==='white';
  for(let i=0;i<d.length;i+=4){const l=.299*d[i]+.587*d[i+1]+.114*d[i+2];
   const a=w?(l>=t?0:l<=t-s?1:(t-l)/s):(l<=t?0:l>=t+s?1:(l-t)/s);d[i+3]=d[i+3]*a}},
 isNeutralState(){return false},
 toObject(){return{type:this.type,mode:this.mode,threshold:this.threshold,soft:this.soft}}});
fabric.Image.filters.BlendIf.fromObject=fabric.Image.filters.BaseFilter.fromObject;

/* ===== document state ===== */
const qs=new URLSearchParams(location.search),PID=qs.get('p')||'main',KEY='mte-doc-'+PID;
const c=new fabric.Canvas('c',{preserveObjectStacking:true,backgroundColor:'#fff'});
fabric.Object.prototype.set({transparentCorners:false,cornerColor:GOLD,cornerStrokeColor:'#000',borderColor:GOLD,cornerSize:matchMedia('(pointer:coarse)').matches?20:11,touchCornerSize:32});
let D={W:1080,H:1080,unit:'px',dpi:96,cm:'rgb',name:'Untitled'},zf=1,hist=[],hi=-1,lock=false,nt;
const smartMap=new Map(),soStack=[];
$('#ver').textContent='v'+VERSION;

/* ===== workspace registry: future modules (e.g. the video editor) plug in here ===== */
const MTE={version:VERSION,workspaces:{},
 addWorkspace(w){/* w={id,label,mount(el),openFile?(file)} */
  let el=$('#ws-'+w.id);if(!el){el=document.createElement('section');el.className='wsp';el.id='ws-'+w.id;$('#toast').before(el)}
  const b=document.createElement('button');b.dataset.ws=w.id;b.textContent=w.label;$('#wsTabs').append(b);
  const sty=document.createElement('style');sty.textContent=`body[data-ws="${w.id}"] #ws-${w.id}{display:flex}`;document.head.append(sty);
  MTE.workspaces[w.id]=w;w.el=el;w.mount&&w.mount(el);return w},
 show(id){document.body.dataset.ws=id;$$('#wsTabs button').forEach(b=>b.classList.toggle('on',b.dataset.ws===id));if(id==='design')setTimeout(fit,30)},
 toast,get canvas(){return c},get doc(){return D}};
window.MTE=MTE;
$('#wsTabs').onclick=e=>{if(e.target.dataset.ws)MTE.show(e.target.dataset.ws)};

/* ===== canvas, history, autosave ===== */
function info(){const u=D.unit!=='px'?` (${r2(fromPx(D.W,D.unit,D.dpi))}×${r2(fromPx(D.H,D.unit,D.dpi))} ${D.unit})`:'';
 $('#info').textContent=`${D.W}×${D.H}px${u} · ${D.cm.toUpperCase()}`;$('#pname').value=D.name||'';$('#cmode').value=D.cm;
 document.title=(D.name||'Untitled')+' — MTE Productive Studio';$('#cmykrow').hidden=D.cm!=='cmyk'}
function fit(){const s=$('#stage');if(!s.clientWidth)return;const pad=innerWidth<800?12:44,
 z=Math.min((s.clientWidth-pad)/D.W,(s.clientHeight-pad)/D.H,1)*zf;
 c.setZoom(z);c.setDimensions({width:Math.max(1,D.W*z),height:Math.max(1,D.H*z)});c.renderAll();info()}
const snapshot=()=>JSON.stringify({v:VERSION,D,j:c.toJSON(PROPS)});
function push(){if(lock)return;const s=snapshot();hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>40)hist.shift();hi=hist.length-1;
 try{localStorage.setItem(KEY,s)}catch(e){}dirty=true;const dd=$('#dirty');if(dd)dd.textContent='●';layers()}
function restore(s){return new Promise(res=>{const d=JSON.parse(s);lock=true;
 D=Object.assign({W:1080,H:1080,unit:'px',dpi:96,cm:'rgb',name:'Untitled'},d.D||{W:d.W,H:d.H});
 if(d.bg&&!d.j.background)d.j.background=d.bg;
 c.loadFromJSON(d.j,()=>{lock=false;fit();layers();res()})})}
$('#undo').onclick=()=>{if(hi>0)restore(hist[--hi])};$('#redo').onclick=()=>{if(hi<hist.length-1)restore(hist[++hi])};
['added','modified','removed'].forEach(e=>c.on('object:'+e,push));
['created','updated','cleared'].forEach(e=>c.on('selection:'+e,()=>{if(editing&&e==='cleared')pathDone();layers();sync()}));
addEventListener('resize',fit);
$('#stage').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zf=clamp(zf*(e.deltaY<0?1.1:.9),.2,4);fit()}},{passive:false});
/* keyboard: delete, undo/redo, arrow-key nudging */
addEventListener('keydown',e=>{const t=c.getActiveObject();if(document.body.dataset.ws!=='design')return;
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||(t&&t.isEditing))return;
 if(e.key==='Escape'){if(editing)pathDone();return}
 if(e.ctrlKey||e.metaKey){if(e.key==='z'){e.preventDefault();$('#undo').click()}if(e.key==='y'){e.preventDefault();$('#redo').click()}if(e.key==='d'){e.preventDefault();add.dup()}return}
 if(!t)return;
 if(e.key==='Delete'||e.key==='Backspace'){c.getActiveObjects().forEach(o=>c.remove(o));c.discardActiveObject();return}
